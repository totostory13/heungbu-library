<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f6f4a">
<title>흥부작은도서관 · 22년생 추천 그림책</title>
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1c2321; --ink-soft:#5b6560; --line:#e3ded3;
  --green:#1f6f4a; --green-soft:#e6f4ec; --green-ink:#155c3b;
  --orange:#b25a00; --orange-soft:#fff0dd; --blue:#1d5fa8; --blue-soft:#e7f0fb;
  --red:#b3261e;
  --shadow:0 1px 2px rgba(16,24,20,.06), 0 8px 24px rgba(16,24,20,.06);
  --r:16px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","맑은 고딕","Malgun Gothic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  line-height:1.55; font-size:16px; word-break:keep-all;}
a{color:var(--blue); text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0; line-height:1.3}
.wrap{max-width:1040px; margin:0 auto; padding:0 16px}

/* ── 헤더 ── */
.hero{background:linear-gradient(160deg,#1f6f4a 0%,#2b8a5c 55%,#3f9e6d 100%); color:#fff; padding:18px 0 16px;}
.hero .kicker{margin:0 0 4px; font-size:12.5px; letter-spacing:.04em; opacity:.85}
.hero h1{font-size:clamp(20px,5vw,28px); font-weight:800; letter-spacing:-.02em}
.hero h1 span{font-weight:600; font-size:.62em; opacity:.92; display:inline-block; margin-top:3px}
.hero .sync{margin:7px 0 0; font-size:11.5px; letter-spacing:.01em; opacity:.82}

/* ── 탭 ── */
.tabs{position:sticky; top:0; z-index:20; background:rgba(246,244,239,.95); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line); padding:8px 0}
.tabs .wrap{display:flex; gap:6px}
.tab{flex:1 1 0; min-height:44px; padding:0 12px; border-radius:999px; border:1px solid var(--line);
  background:#fff; color:var(--ink-soft); font-size:14.5px; font-weight:700; cursor:pointer; white-space:nowrap}
.tab[aria-selected="true"]{background:var(--green); border-color:var(--green); color:#fff}
main{padding:12px 0 32px}
.tab-panel{display:none}
.tab-panel.active{display:block}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.pad{padding:14px}
.muted{color:var(--ink-soft)}
.small{font-size:13px}
.tiny{font-size:12px}

/* ── 검색·필터 ── */
.toolbar{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); padding:10px; margin-bottom:10px}
.searchbox{position:relative; display:flex; align-items:center}
.searchbox input{width:100%; min-height:46px; padding:0 44px 0 42px; border-radius:12px; border:1px solid var(--line);
  background:#fbfaf7; font-size:16px; color:var(--ink)}
.searchbox input:focus{outline:2px solid #9ed0b4; border-color:#8cc7a7; background:#fff}
.searchbox .ico{position:absolute; left:13px; font-size:16px; opacity:.6}
.searchbox .clear{position:absolute; right:6px; width:36px; height:36px; border:0; border-radius:50%; background:transparent;
  color:var(--ink-soft); font-size:18px; cursor:pointer; display:none}
.searchbox.has-value .clear{display:block}
.chips{display:flex; gap:6px; flex-wrap:nowrap; overflow-x:auto; margin-top:9px; padding-bottom:1px;
  scrollbar-width:none; -webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto; min-height:36px; padding:0 12px; border-radius:999px; border:1px solid var(--line); background:#fff;
  color:var(--ink-soft); font-size:13.5px; font-weight:700; cursor:pointer; white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:#fff}
.chip.hb[aria-pressed="true"]{background:var(--green); border-color:var(--green)}
.chip.il[aria-pressed="true"]{background:var(--orange); border-color:var(--orange)}
.result-line{margin:0 0 10px; font-size:13.5px; color:var(--ink-soft)}

/* ── 책 카드 (컴팩트 · 탭하면 펼침) ── */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(285px,1fr)); gap:9px; align-items:start}
.book{background:var(--card); border:1px solid var(--line); border-radius:13px;
  box-shadow:0 1px 2px rgba(16,24,20,.05); overflow:hidden}
.book.hb{border-left:3px solid var(--green)}
.book.il{border-left:3px solid var(--orange)}
.book-head{position:relative}
.book-toggle{display:block; width:100%; margin:0; padding:8px 12px 9px; background:none; border:0;
  font:inherit; color:inherit; text-align:left; cursor:pointer; -webkit-tap-highlight-color:transparent}
.book-toggle:active{background:#faf9f5}
.book-toggle:focus-visible{outline:2px solid #8cc7a7; outline-offset:-2px; border-radius:12px}
.book.open .book-toggle{background:#fbfdfb}
.tline{display:flex; align-items:center; gap:6px; padding-right:34px}
.ttl{flex:1 1 auto; min-width:0; font-size:15px; font-weight:800; letter-spacing:-.02em; line-height:1.32;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.chev{flex:0 0 auto; font-size:10px; color:#a9b1ab; transition:transform .25s ease}
.book.open .chev{transform:rotate(180deg)}
.subline{display:flex; align-items:center; gap:5px; flex-wrap:wrap; margin-top:4px; padding-right:34px}
.badge{display:inline-flex; align-items:center; gap:4px; border-radius:999px; font-weight:800}
.badge.sm{padding:2px 7px; font-size:11px; line-height:1.5}
.badge.hb{background:var(--green-soft); color:var(--green-ink); border:1px solid #bfe3cf}
.badge.il{background:var(--orange-soft); color:var(--orange); border:1px solid #ffd8a8}
.badge.wait{background:#f0efe9; color:#6b6b62; border:1px solid #e0ded2}
.meta2{font-size:11.5px; color:var(--ink-soft); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.st{flex:0 0 auto; font-size:11px; font-weight:800; padding:1px 6px; border-radius:6px; line-height:1.5}
.st.ok{background:var(--green-soft); color:var(--green-ink); border:1px solid #cde8d9}
.st.no{background:#f8eeee; color:#8a4b46; border:1px solid #ecd6d4}
.st.na{background:#f1f0ea; color:#6b6b62; border:1px solid #e0ded2}
.fav{position:absolute; top:6px; right:6px; width:32px; height:32px; padding:0; border-radius:50%; border:1px solid transparent;
  background:transparent; font-size:16px; cursor:pointer; color:#b9b3a6; line-height:1}
.fav:hover{background:#f4f2ec}
.fav[aria-pressed="true"]{color:#d93b6a; background:#fff5f8; border-color:#f3c2d1}
/* 펼침 영역 */
.detail-wrap{display:grid; grid-template-rows:0fr; transition:grid-template-rows .28s ease}
.book.open .detail-wrap{grid-template-rows:1fr}
.detail{overflow:hidden; min-height:0}
.detail-in{padding:9px 12px 11px; border-top:1px dashed var(--line); display:grid; gap:8px}
.dcall{display:flex; align-items:baseline; flex-wrap:wrap; gap:6px; font-size:11.5px; color:var(--ink-soft)}
.dcall .call{font-size:12.5px; font-weight:800; color:#333b37}
.dlibs{list-style:none; margin:0; padding:0; display:grid; gap:2px}
.dlib{display:grid; grid-template-columns:62px 1fr auto; align-items:center; gap:6px; font-size:11.5px;
  color:#4b544f; padding:1px 0}
.dlib .ln{font-weight:800; white-space:nowrap; color:#48514c}
.dlib.here .ln{color:var(--green-ink)}
.dlib .lc{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#66716b}
.ls{font-size:10.5px; font-weight:800; padding:0 5px; border-radius:5px; white-space:nowrap; line-height:1.7}
.ls.ok{background:var(--green-soft); color:var(--green-ink)}
.ls.no{background:#f8eeee; color:#8a4b46}
.ls.na{background:#f1f0ea; color:#6b6b62}
.reason{margin:0; font-size:12.5px; color:#37403b; background:#fbfaf6; border:1px dashed var(--line);
  border-radius:9px; padding:7px 9px; line-height:1.5}
.drow{display:flex; align-items:center; gap:5px; flex-wrap:wrap}
.pill{font-size:11px; font-weight:700; padding:1px 7px; border-radius:7px; background:#f4f2ec; color:#4b544f; border:1px solid var(--line)}
.pill.tags{background:var(--blue-soft); color:var(--blue); border-color:#cfe0f5}
.call{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px}
.linkbtn{font-size:12px; font-weight:800; min-height:32px; display:inline-flex; align-items:center; gap:4px; padding:0 9px;
  margin-left:auto; border-radius:8px; border:1px solid var(--line); background:#fff; color:var(--blue)}
.empty{text-align:center; padding:28px 12px; color:var(--ink-soft); background:var(--card); border:1px dashed var(--line); border-radius:var(--r)}

/* ── 대출·반납 ── */
.loans{list-style:none; padding:0; margin:0; display:grid; gap:8px}
.loan{border:1px solid var(--line); border-radius:12px; padding:11px 12px; background:#fff; display:grid; gap:6px}
.loan-top{display:flex; justify-content:space-between; gap:8px; align-items:flex-start}
.loan h4{font-size:14.5px; margin:0}
.loan .who{font-size:12px; color:var(--ink-soft)}
.dday{font-weight:900; font-size:15px; padding:3px 9px; border-radius:8px; white-space:nowrap}
.dday.now{background:var(--green-soft); color:var(--green-ink)}
.dday.soon{background:var(--orange-soft); color:var(--orange)}
.dday.over{background:#fdeceb; color:var(--red)}
.loan-actions{display:flex; gap:6px; flex-wrap:wrap}
.mini{min-height:34px; padding:0 10px; border-radius:8px; border:1px solid var(--line); background:#fff; font-size:12.5px; font-weight:800; cursor:pointer; color:#48514c}
.mini:hover{background:#f7f5ef}
.mini.danger{color:var(--red); border-color:#eccfcd}
.form{display:grid; gap:10px}
.field{display:grid; gap:5px}
.field label{font-size:13px; font-weight:800; color:#3c443f}
.field input[type=text], .field input[type=date], .field select{
  min-height:44px; padding:8px 11px; border-radius:10px; border:1px solid var(--line); font-size:15px; background:#fbfaf7; color:var(--ink); width:100%}
.field input:focus, .field select:focus{outline:2px solid #9ed0b4; border-color:#8cc7a7; background:#fff}
.form-row{display:grid; grid-template-columns:1fr 1fr; gap:10px}
@media(max-width:620px){ .form-row{grid-template-columns:1fr} }
.check{display:flex; align-items:center; gap:9px; font-size:14px; font-weight:700; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:#fbfaf7}
.check input{width:20px; height:20px}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:42px; padding:0 15px;
  border-radius:999px; font-size:14.5px; font-weight:700; border:1px solid transparent; cursor:pointer}
.btn.primary{background:var(--green); color:#fff}
.result{display:none; margin-top:10px; border:1px solid #bfe3cf; background:var(--green-soft); border-radius:12px; padding:12px}
.result.show{display:block}
.result .big{font-size:18px; font-weight:800; color:var(--green-ink)}
.kv{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:13.5px; margin:8px 0 0}
.kv dt{color:var(--ink-soft); font-weight:700}
.kv dd{margin:0; font-weight:700}
.lib-switch{display:grid; grid-template-columns:1fr 1fr; gap:6px; background:#efeae1; padding:4px; border-radius:12px}
.lib-opt{border:0; background:transparent; padding:8px 10px; border-radius:9px; font-size:13px; font-weight:700; color:var(--ink-soft); cursor:pointer; transition:all .15s ease}
.lib-opt[aria-pressed="true"]{background:#fff; color:var(--green-ink); box-shadow:0 1px 4px rgba(0,0,0,.08)}
.sec-title{font-size:15px; font-weight:800; margin:16px 0 8px; display:flex; align-items:center; gap:6px}
.sec-title:first-child{margin-top:0}
footer{border-top:1px solid var(--line); padding:14px 0 26px; color:var(--ink-soft); font-size:11.5px}
footer p{margin:0}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <p class="kicker">22년생 · 만 4~5세</p>
    <h1 id="heroTitle">흥부작은도서관 <span>추천 그림책 30권</span></h1>
    <p class="sync">반영 기준: 2026-11-28 18:25</p>
  </div>
</header>

<nav class="tabs" aria-label="화면 선택">
  <div class="wrap">
    <button class="tab" id="tabBtn-books" role="tab" aria-selected="true" aria-controls="tab-books">📚 추천도서</button>
    <button class="tab" id="tabBtn-loans" role="tab" aria-selected="false" aria-controls="tab-loans">📅 내 대출·반납</button>
  </div>
</nav>

<main class="wrap">

  <!-- ══════════ 추천도서 ══════════ -->
  <section class="tab-panel active" id="tab-books" role="tabpanel" aria-labelledby="tabBtn-books">
    <div class="toolbar">
      <div class="lib-switch" id="baseLibSwitch" role="group" aria-label="기준 도서관 선택">
        <button class="lib-opt" type="button" data-lib="흥부작은도서관" aria-pressed="true">📍 흥부작은도서관</button>
        <button class="lib-opt" type="button" data-lib="북울진도서관" aria-pressed="false">📍 북울진도서관</button>
      </div>

        <span class="ico">🔍</span>
        <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="제목·저자·출판사로 찾기 (예: 수박)">

      </div>

        <button class="chip" data-filter="all" aria-pressed="true">전체</button>
        <button class="chip hb" id="hereChip" data-filter="here" aria-pressed="false">✅ 흥부 바로 대출</button>
        <button class="chip il" id="needChip" data-filter="need" aria-pressed="false">🔄 상호대차 필요</button>

        <button class="chip" data-filter="tag:유치원·학교" aria-pressed="false">유치원·학교</button>
        <button class="chip" data-filter="tag:옛이야기" aria-pressed="false">옛이야기</button>
        <button class="chip" data-filter="fav" aria-pressed="false">♥ 내 찜</button>
      </div>
    </div>
    <p class="result-line" id="resultLine"></p>
    <div class="grid" id="bookGrid"></div>
    <p class="empty" id="emptyMsg" hidden>조건에 맞는 책이 없어요.</p>
  </section>

  <!-- ══════════ 내 대출·반납 ══════════ -->
  <section class="tab-panel" id="tab-loans" role="tabpanel" aria-labelledby="tabBtn-loans">
    <h2 class="sec-title">가족 통합 대출 중 <span class="small muted" id="loanCount"></span></h2>
    <p class="small muted" style="margin:-2px 0 8px">가족회원 통합 조회 기준 · 본인 5권 · 가족 5권</p>
    <div class="card pad">
      <ul class="loans" id="loanList"></ul>
      <p class="empty" id="loanEmpty" style="border:1px dashed var(--line)">대출 중인 책이 없어요.</p>
    </div>

    <h2 class="sec-title">새 대출 추가</h2>
    <div class="card pad">
      <form class="form" id="loanForm" autocomplete="off">
        <div class="field">
          <label for="l_title">책 제목</label>
          <input type="text" id="l_title" placeholder="예: 수박 수영장" required>
        </div>
        <div class="form-row">
          <div class="field">
            <label for="l_lib">수령·반납 도서관</label>
            <select id="l_lib">
              <option value="small" selected>흥부작은도서관 (일요일 휴관)</option>
              <option value="big">북울진·울진남부도서관 (월요일 휴관)</option>
            </select>
          </div>
          <div class="field">
            <label for="l_date">대출일</label>
            <input type="date" id="l_date" required>
          </div>
        </div>
        <label class="check"><input type="checkbox" id="l_inter"> 상호대차로 받은 책</label>
        <div><button class="btn primary" type="submit">추가하기</button></div>
      </form>
      <div class="result" id="calcResult"></div>
    </div>

    <div style="margin-top:14px">
      <button class="mini danger" id="resetAll" type="button">찜·일정 모두 지우기</button>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <p>소장 정보 2026-11-28 18:25 확인(흥부·북울진 전수, 그 외 관은 10:35 기준) · 울진군 통합도서관 자료검색 · 가족이 이미 빌린 책(현재 대출+과거 대출이력)은 추천에서 제외 · 카드를 누르면 청구기호·도서관별 상태가 펼쳐집니다</p>
  </div>
</footer>

const MS = 86400000;
function ymd(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function parseYmd(s){ const p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function today0(){ const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function addDays(d, n){ const x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
function daysBetween(a, b){ return Math.round((b.getTime() - a.getTime()) / MS); }
const WD = ['일','월','화','수','목','금','토'];
function label(d){ return (d.getMonth()+1) + '월 ' + d.getDate() + '일(' + WD[d.getDay()] + ')'; }
function labelFull(d){ return d.getFullYear() + '. ' + label(d); }
function holidayName(d){ return HOLIDAYS[ymd(d)] || null; }
function isClosed(d, type){
  if (holidayName(d)) return true;
  if (type === 'big') return d.getDay() === 1;
  return d.getDay() === 0;
}
function nextOpen(d, type){
  let x = new Date(d.getTime()), guard = 0;
  while (isClosed(x, type) && guard < 30){ x = addDays(x, 1); guard++; }
  return x;
}

  const sn = shortName(baseLib);
  const isHB = baseLib === '흥부작은도서관';
  const countN = isHB ? BOOKS.length : BOOKS.filter(b => !getView(b).need).length;
  heroTitle.innerHTML = esc(baseLib) + ' <span>추천 그림책 ' + countN + '권</span>';
  hereChip.textContent = '✅ ' + sn + ' 바로 대출';
  needChip.hidden = !isHB;
  if (!isHB && filter === 'need') {
    filter = 'all';
    document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.filter === 'all')));
  }
  document.querySelectorAll('#baseLibSwitch .lib-opt').forEach(btn => {
    btn.setAttribute('aria-pressed', String(btn.dataset.lib === baseLib));
  });
}

function render(){
  syncBaseLibUI();
  const isHB = baseLib === '흥부작은도서관';
  const q = qEl.value.trim().toLowerCase();
  searchBox.classList.toggle('has-value', qEl.value.length > 0);
  const baseList = isHB ? BOOKS : BOOKS.filter(b => !getView(b).need);
  const list = baseList.filter(b => {
    const v = getView(b);
    let ok = true;
    if (filter === 'here') ok = !v.need && v.status === '대출가능';
    else if (filter === 'need') ok = v.need;
    else if (filter === 'fav') ok = FAV.has(b.id);
    else if (filter.indexOf('tag:') === 0) ok = b.tags.indexOf(filter.slice(4)) >= 0;
    if (!ok) return false;
    if (!q) return true;
    const hay = (b.title + ' ' + b.author + ' ' + b.pub + ' ' + b.tags.join(' ') + ' ' + v.call).toLowerCase();
    return hay.indexOf(q) >= 0;
  });
  grid.innerHTML = list.map(card).join('');
  emptyMsg.hidden = list.length > 0;
  const hbN = baseList.filter(b => !getView(b).need).length;
  const ilN = baseList.filter(b => getView(b).need).length;
  const sn = shortName(baseLib);
  resultLine.innerHTML = (isHB
    ? '전체 <b>' + baseList.length + '권</b> · ✅ ' + sn + ' <b>' + hbN + '권</b> · 🔄 상호대차 <b>' + ilN + '권</b>'
    : '북울진 소장 <b>' + baseList.length + '권</b> (상호대차 제외)') +
    ' &nbsp;|&nbsp; 지금 <b>' + list.length + '권</b>';
  emptyMsg.textContent = (filter === 'fav') ? '찜한 책이 아직 없어요. 카드 오른쪽 ♡를 눌러 담아 보세요.' : '조건에 맞는 책이 없어요.';
}

document.getElementById('baseLibSwitch').addEventListener('click', e => {
  const btn = e.target.closest('.lib-opt');
  if (!btn) return;
  baseLib = btn.dataset.lib;
  store.set('heungbu_base_lib_v1', baseLib);
  render();
});

document.getElementById('chips').addEventListener('click', e => {
  const btn = e.target.closest('.chip');
  if (!btn) return;
  filter = btn.dataset.filter;
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === btn)));
  render();
});
qEl.addEventListener('input', render);
document.getElementById('clearQ').addEventListener('click', () => { qEl.value = ''; render(); qEl.focus(); });
grid.addEventListener('click', e => {
  const cp = e.target.closest('[data-copy-req]');
  if (cp){
    const title = cp.dataset.copyReq;
    const msg = shortName(baseLib) + ' 수령으로 "' + title + '" 상호대차 신청해 주세요';
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(msg).catch(()=>{});
    }
    const prev = cp.textContent;
    cp.textContent = '✅ 복사됨! 채팅에 붙여넣기';
    setTimeout(() => { cp.textContent = prev; }, 2200);
    return;
  }
  const favBtn = e.target.closest('[data-fav]');
  if (favBtn){
    const id = favBtn.dataset.fav;
    if (FAV.has(id)) FAV.delete(id); else FAV.add(id);
    store.set('heungbu_fav_v1', Array.from(FAV));
    favBtn.setAttribute('aria-pressed', String(FAV.has(id)));
    favBtn.textContent = FAV.has(id) ? '♥' : '♡';
    if (filter === 'fav') render();
    return;
  }
  const toggle = e.target.closest('.book-toggle');
  if (toggle) toggleBook(toggle.closest('.book'));
});
function toggleBook(art){
  if (!art) return;
  const id = art.dataset.id;
  const open = !art.classList.contains('open');
  art.classList.toggle('open', open);
  const btn = art.querySelector('.book-toggle');
  if (btn) btn.setAttribute('aria-expanded', String(open));
  const dw = art.querySelector('.detail-wrap');
  if (dw){ dw.inert = !open; dw.toggleAttribute('inert', !open); }
  if (open) OPEN.add(id); else OPEN.delete(id);
}

/* ────────── 계산 ────────── */
function compute(loanDate, type){
  const base = addDays(loanDate, 15);
  const due = isClosed(base, type) ? nextOpen(base, type) : base;
  const extBase = addDays(base, 7);
  const ext = isClosed(extBase, type) ? nextOpen(extBase, type) : extBase;
  return {base, due, ext, shifted: ymd(base) !== ymd(due), extShifted: ymd(extBase) !== ymd(ext)};
}

const form = document.getElementById('loanForm');
const dateInput = document.getElementById('l_date');
dateInput.value = ymd(today0());
const calcResult = document.getElementById('calcResult');

form.addEventListener('submit', e => {
  e.preventDefault();
  const title = document.getElementById('l_title').value.trim();
  if (!title) return;
  const type = document.getElementById('l_lib').value;
  const loanDate = parseYmd(dateInput.value);
  const c = compute(loanDate, type);
  const dday = daysBetween(today0(), c.due);
  let html = '<div class="big">' + esc(title) + '</div>';
  html += '<dl class="kv">';
  html += '<dt>대출일</dt><dd>' + labelFull(loanDate) + '</dd>';
  html += '<dt>반납예정일</dt><dd>' + labelFull(c.due) + (c.shifted ? ' <span class="small muted">(휴관일이라 다음 개관일)</span>' : '') + '</dd>';
  html += '<dt>연장하면</dt><dd>' + labelFull(c.ext) + ' <span class="small muted">(7일)</span></dd>';
  html += '<dt>남은 날</dt><dd><span class="dday ' + (dday < 0 ? 'over' : (dday <= 3 ? 'soon' : 'now')) + '">' + (dday < 0 ? 'D+' + Math.abs(dday) + ' 연체' : (dday === 0 ? 'D-DAY' : 'D-' + dday)) + '</span></dd>';
  html += '</dl>';
  calcResult.innerHTML = html;
  calcResult.classList.add('show');
  LOANS.push({title, borrower:'본인', type, loanDate: ymd(loanDate), interloan: document.getElementById('l_inter').checked, extended: false, added: ymd(new Date())});
  store.set('heungbu_loans_v5', LOANS);
  document.getElementById('l_title').value = '';
  document.getElementById('l_inter').checked = false;
  renderLoans();
});

function loanItem(l, i){
  const type = l.type || 'small';
  const c = compute(parseYmd(l.loanDate), type);
  const due = l.extended ? c.ext : c.due;
  const dday = daysBetween(today0(), due);
  const cls = dday < 0 ? 'over' : (dday <= 3 ? 'soon' : 'now');
  const txt = dday < 0 ? 'D+' + Math.abs(dday) + ' 연체' : (dday === 0 ? 'D-DAY' : 'D-' + dday);
  return '<li class="loan">' +
    '<div class="loan-top"><div><h4>' + esc(l.title) + '</h4>' +
      '<div class="who">' + (l.borrower ? esc(l.borrower) + ' · ' : '') + (l.interloan ? '상호대차 · ' : '') + '대출 ' + l.loanDate + '</div></div>' +
      '<span class="dday ' + cls + '">' + txt + '</span></div>' +
    '<div class="who">반납 ' + labelFull(due) + (l.extended ? ' · 7일 연장함' : (c.shifted ? ' · 다음 개관일' : '')) + '</div>' +
    '<div class="loan-actions">' +
      '<button class="mini" data-ext="' + i + '">' + (l.extended ? '연장 취소' : '7일 연장') + '</button>' +
      '<button class="mini danger" data-del="' + i + '">삭제</button>' +
    '</div></li>';
}

function renderLoans(){
  const list = document.getElementById('loanList');
  const empty = document.getElementById('loanEmpty');
  const cnt = document.getElementById('loanCount');
  const items = LOANS.map((l, i) => ({l, i}));
  items.sort((a, b) => {
    const A = compute(parseYmd(a.l.loanDate), a.l.type || 'small');
    const B = compute(parseYmd(b.l.loanDate), b.l.type || 'small');
    return (a.l.extended ? A.ext : A.due) - (b.l.extended ? B.ext : B.due);
  });
  list.innerHTML = items.map(x => loanItem(x.l, x.i)).join('');
  empty.hidden = LOANS.length > 0;
  cnt.textContent = LOANS.length ? '(' + LOANS.length + '권)' : '';
}
document.getElementById('loanList').addEventListener('click', e => {
  const ext = e.target.closest('[data-ext]');
  const del = e.target.closest('[data-del]');
  if (ext){ const i = Number(ext.dataset.ext); LOANS[i].extended = !LOANS[i].extended; store.set('heungbu_loans_v5', LOANS); renderLoans(); }
  if (del){ const i = Number(del.dataset.del); LOANS.splice(i, 1); store.set('heungbu_loans_v5', LOANS); renderLoans(); }
});

document.getElementById('resetAll').addEventListener('click', () => {
  if (!confirm('찜 목록과 대출 일정을 모두 지울까요?')) return;
  FAV = new Set(); LOANS = [];
  store.set('heungbu_fav_v1', []); store.set('heungbu_loans_v5', []);
  render(); renderLoans();
});

/* ────────── 시작 ────────── */
render();
renderLoans();
</script>
