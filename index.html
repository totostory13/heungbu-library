<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f6f4a">
<title>흥부작은도서관 · 22년생 추천 그림책</title>
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1c2321; --ink-soft:#5b6560; --line:#e3ded3;
  --green:#1f6f4a; --green-soft:#e6f4ec; --green-ink:#155c3b;
  --orange:#b25a00; --orange-soft:#fff0dd; --blue:#1d5fa8; --blue-soft:#e7f0fb;
  --red:#b3261e;
  --shadow:0 1px 2px rgba(16,24,20,.06), 0 8px 24px rgba(16,24,20,.06);
  --r:16px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","맑은 고딕","Malgun Gothic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  line-height:1.55; font-size:16px; word-break:keep-all;}
a{color:var(--blue); text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0; line-height:1.3}
.wrap{max-width:1040px; margin:0 auto; padding:0 16px}

/* ── 헤더 ── */
.hero{background:linear-gradient(160deg,#1f6f4a 0%,#2b8a5c 55%,#3f9e6d 100%); color:#fff; padding:18px 0 16px;}
.hero .kicker{margin:0 0 4px; font-size:12.5px; letter-spacing:.04em; opacity:.85}
.hero h1{font-size:clamp(20px,5vw,28px); font-weight:800; letter-spacing:-.02em}
.hero h1 span{font-weight:600; font-size:.62em; opacity:.92; display:inline-block; margin-top:3px}

/* ── 탭 ── */
.tabs{position:sticky; top:0; z-index:20; background:rgba(246,244,239,.95); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line); padding:8px 0}
.tabs .wrap{display:flex; gap:6px}
.tab{flex:1 1 0; min-height:44px; padding:0 12px; border-radius:999px; border:1px solid var(--line);
  background:#fff; color:var(--ink-soft); font-size:14.5px; font-weight:700; cursor:pointer; white-space:nowrap}
.tab[aria-selected="true"]{background:var(--green); border-color:var(--green); color:#fff}
main{padding:16px 0 36px}
.tab-panel{display:none}
.tab-panel.active{display:block}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.pad{padding:14px}
.muted{color:var(--ink-soft)}
.small{font-size:13px}
.tiny{font-size:12px}

/* ── 검색·필터 ── */
.toolbar{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); padding:12px; margin-bottom:12px}
.searchbox{position:relative; display:flex; align-items:center}
.searchbox input{width:100%; min-height:46px; padding:0 44px 0 42px; border-radius:12px; border:1px solid var(--line);
  background:#fbfaf7; font-size:16px; color:var(--ink)}
.searchbox input:focus{outline:2px solid #9ed0b4; border-color:#8cc7a7; background:#fff}
.searchbox .ico{position:absolute; left:13px; font-size:16px; opacity:.6}
.searchbox .clear{position:absolute; right:6px; width:36px; height:36px; border:0; border-radius:50%; background:transparent;
  color:var(--ink-soft); font-size:18px; cursor:pointer; display:none}
.searchbox.has-value .clear{display:block}
.chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px}
.chip{min-height:36px; padding:0 12px; border-radius:999px; border:1px solid var(--line); background:#fff;
  color:var(--ink-soft); font-size:13.5px; font-weight:700; cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:#fff}
.chip.hb[aria-pressed="true"]{background:var(--green); border-color:var(--green)}
.chip.il[aria-pressed="true"]{background:var(--orange); border-color:var(--orange)}
.result-line{margin:0 0 10px; font-size:13.5px; color:var(--ink-soft)}

/* ── 책 카드 ── */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px}
.book{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow);
  padding:14px; display:flex; flex-direction:column; gap:9px}
.book.hb{border-left:4px solid var(--green)}
.book.il{border-left:4px solid var(--orange)}
.book-top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px}
.badge{display:inline-flex; align-items:center; gap:5px; padding:4px 9px; border-radius:999px; font-size:12px; font-weight:800}
.badge.hb{background:var(--green-soft); color:var(--green-ink); border:1px solid #bfe3cf}
.badge.il{background:var(--orange-soft); color:var(--orange); border:1px solid #ffd8a8}
.badge.wait{background:#f0efe9; color:#6b6b62; border:1px solid #e0ded2}
.fav{flex:0 0 auto; width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:#fff;
  font-size:17px; cursor:pointer; color:#b9b3a6; line-height:1}
.fav[aria-pressed="true"]{color:#d93b6a; border-color:#f3c2d1; background:#fff5f8}
.book h3{font-size:16.5px; font-weight:800; letter-spacing:-.02em}
.book .meta{font-size:12.5px; color:var(--ink-soft); margin:0}
.rowline{display:flex; flex-wrap:wrap; align-items:center; gap:6px}
.pill{font-size:12px; font-weight:700; padding:2px 8px; border-radius:8px; background:#f4f2ec; color:#4b544f; border:1px solid var(--line)}
.pill.ok{background:var(--green-soft); color:var(--green-ink); border-color:#bfe3cf}
.pill.no{background:#f6eeee; color:#8a4b46; border-color:#ecd6d4}
.pill.tags{background:var(--blue-soft); color:var(--blue); border-color:#cfe0f5}
.call{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px}
.libs{display:flex; flex-wrap:wrap; gap:5px}
.lib{font-size:11.5px; padding:3px 7px; border-radius:8px; background:#faf9f5; border:1px solid var(--line); color:#4b544f}
.lib b{font-weight:800}
.lib.here{background:var(--green-soft); border-color:#bfe3cf; color:var(--green-ink)}
.lib.away{background:#fffaf1; border-color:#f0e2cc; color:#7a5a25}
.lib .dot{display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:4px; vertical-align:1px}
.dot.ok{background:#2f9e63}.dot.no{background:#c2705c}.dot.na{background:#b9b3a6}
.reason{margin:0; font-size:13.5px; color:#333b37; background:#fbfaf6; border:1px dashed var(--line); border-radius:10px; padding:9px 10px}
.book-foot{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:auto}
.linkbtn{font-size:13px; font-weight:700; min-height:36px; display:inline-flex; align-items:center; gap:5px; padding:0 10px;
  border-radius:9px; border:1px solid var(--line); background:#fff; color:var(--blue)}
.empty{text-align:center; padding:28px 12px; color:var(--ink-soft); background:var(--card); border:1px dashed var(--line); border-radius:var(--r)}

/* ── 대출·반납 ── */
.loans{list-style:none; padding:0; margin:0; display:grid; gap:8px}
.loan{border:1px solid var(--line); border-radius:12px; padding:11px 12px; background:#fff; display:grid; gap:6px}
.loan-top{display:flex; justify-content:space-between; gap:8px; align-items:flex-start}
.loan h4{font-size:14.5px; margin:0}
.loan .who{font-size:12px; color:var(--ink-soft)}
.dday{font-weight:900; font-size:15px; padding:3px 9px; border-radius:8px; white-space:nowrap}
.dday.now{background:var(--green-soft); color:var(--green-ink)}
.dday.soon{background:var(--orange-soft); color:var(--orange)}
.dday.over{background:#fdeceb; color:var(--red)}
.loan-actions{display:flex; gap:6px; flex-wrap:wrap}
.mini{min-height:34px; padding:0 10px; border-radius:8px; border:1px solid var(--line); background:#fff; font-size:12.5px; font-weight:800; cursor:pointer; color:#48514c}
.mini:hover{background:#f7f5ef}
.mini.danger{color:var(--red); border-color:#eccfcd}
.form{display:grid; gap:10px}
.field{display:grid; gap:5px}
.field label{font-size:13px; font-weight:800; color:#3c443f}
.field input[type=text], .field input[type=date], .field select{
  min-height:44px; padding:8px 11px; border-radius:10px; border:1px solid var(--line); font-size:15px; background:#fbfaf7; color:var(--ink); width:100%}
.field input:focus, .field select:focus{outline:2px solid #9ed0b4; border-color:#8cc7a7; background:#fff}
.form-row{display:grid; grid-template-columns:1fr 1fr; gap:10px}
@media(max-width:620px){ .form-row{grid-template-columns:1fr} }
.check{display:flex; align-items:center; gap:9px; font-size:14px; font-weight:700; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:#fbfaf7}
.check input{width:20px; height:20px}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:42px; padding:0 15px;
  border-radius:999px; font-size:14.5px; font-weight:700; border:1px solid transparent; cursor:pointer}
.btn.primary{background:var(--green); color:#fff}
.result{display:none; margin-top:10px; border:1px solid #bfe3cf; background:var(--green-soft); border-radius:12px; padding:12px}
.result.show{display:block}
.result .big{font-size:18px; font-weight:800; color:var(--green-ink)}
.kv{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:13.5px; margin:8px 0 0}
.kv dt{color:var(--ink-soft); font-weight:700}
.kv dd{margin:0; font-weight:700}
.sec-title{font-size:15px; font-weight:800; margin:16px 0 8px; display:flex; align-items:center; gap:6px}
.sec-title:first-child{margin-top:0}
footer{border-top:1px solid var(--line); padding:14px 0 26px; color:var(--ink-soft); font-size:11.5px}
footer p{margin:0}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}

</head>

<header class="hero">

    <h1>흥부작은도서관 <span>추천 그림책 30권</span></h1>
  </div>
</header>

  <div class="wrap">
    <button class="tab" id="tabBtn-books" role="tab" aria-selected="true" aria-controls="tab-books">📚 추천도서</button>
    <button class="tab" id="tabBtn-loans" role="tab" aria-selected="false" aria-controls="tab-loans">📅 내 대출·반납</button>
  </div>
</nav>

<main class="wrap">

  <!-- ══════════ 추천도서 ══════════ -->
  <section class="tab-panel active" id="tab-books" role="tabpanel" aria-labelledby="tabBtn-books">
    <div class="toolbar">
      <div class="searchbox" id="searchBox">
        <span class="ico">🔍</span>
        <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="제목·저자·출판사로 찾기 (예: 수박)">
        <button class="clear" id="clearQ" type="button" aria-label="검색어 지우기">✕</button>
      </div>
      <div class="chips" id="chips" role="group" aria-label="빠른 필터">
        <button class="chip" data-filter="all" aria-pressed="true">전체</button>
        <button class="chip hb" data-filter="here" aria-pressed="false">✅ 흥부 바로 대출</button>
        <button class="chip il" data-filter="need" aria-pressed="false">🔄 상호대차 필요</button>
        <button class="chip" data-filter="tag:상상·모험" aria-pressed="false">상상·모험</button>
        <button class="chip" data-filter="tag:생활·감정" aria-pressed="false">생활·감정</button>
        <button class="chip" data-filter="tag:사회성·우정" aria-pressed="false">사회성·우정</button>
        <button class="chip" data-filter="tag:유치원·학교" aria-pressed="false">유치원·학교</button>
        <button class="chip" data-filter="tag:옛이야기" aria-pressed="false">옛이야기</button>
        <button class="chip" data-filter="fav" aria-pressed="false">♥ 내 찜</button>
      </div>
    </div>
    <p class="result-line" id="resultLine"></p>
    <p class="result-line" style="margin-top:-4px"><span class="lib" style="padding:2px 6px"><span class="dot ok"></span>대출가능</span> <span class="lib" style="padding:2px 6px"><span class="dot no"></span>대출중</span> <span class="lib" style="padding:2px 6px"><span class="dot na"></span>대출불가</span></p>
    <div class="grid" id="bookGrid"></div>
    <p class="empty" id="emptyMsg" hidden>조건에 맞는 책이 없어요.</p>
  </section>

  <!-- ══════════ 내 대출·반납 ══════════ -->
  <section class="tab-panel" id="tab-loans" role="tabpanel" aria-labelledby="tabBtn-loans">
    <h2 class="sec-title">가족 통합 대출 중 <span class="small muted" id="loanCount"></span></h2>
    <p class="small muted" style="margin:-2px 0 8px">가족회원 통합 조회 기준 · 본인 5권 · 가족 0권</p>
    <div class="card pad">
      <ul class="loans" id="loanList"></ul>
      <p class="empty" id="loanEmpty" style="border:1px dashed var(--line)">대출 중인 책이 없어요.</p>
    </div>

    <h2 class="sec-title">새 대출 추가</h2>
    <div class="card pad">
      <form class="form" id="loanForm" autocomplete="off">
        <div class="field">
          <label for="l_title">책 제목</label>
          <input type="text" id="l_title" placeholder="예: 수박 수영장" required>
        </div>
        <div class="form-row">
          <div class="field">
            <label for="l_lib">수령·반납 도서관</label>
            <select id="l_lib">
              <option value="small" selected>흥부작은도서관 (일요일 휴관)</option>
              <option value="big">북울진·울진남부도서관 (월요일 휴관)</option>
            </select>
          </div>
          <div class="field">
            <label for="l_date">대출일</label>
            <input type="date" id="l_date" required>
          </div>
        </div>
        <label class="check"><input type="checkbox" id="l_inter"> 상호대차로 받은 책</label>
        <div><button class="btn primary" type="submit">추가하기</button></div>
      </form>
      <div class="result" id="calcResult"></div>
    </div>

    <div style="margin-top:14px">
      <button class="mini danger" id="resetAll" type="button">찜·일정 모두 지우기</button>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <p>소장 정보 2026-11-22 조회 · 울진군 통합도서관 자료검색</p>
  </div>
</footer>

const MS = 86400000;
function ymd(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function parseYmd(s){ const p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function today0(){ const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function addDays(d, n){ const x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
function daysBetween(a, b){ return Math.round((b.getTime() - a.getTime()) / MS); }
const WD = ['일','월','화','수','목','금','토'];
function label(d){ return (d.getMonth()+1) + '월 ' + d.getDate() + '일(' + WD[d.getDay()] + ')'; }
function labelFull(d){ return d.getFullYear() + '. ' + label(d); }
function holidayName(d){ return HOLIDAYS[ymd(d)] || null; }
function isClosed(d, type){
  if (holidayName(d)) return true;
  if (type === 'big') return d.getDay() === 1;
  return d.getDay() === 0;
}
function nextOpen(d, type){
  let x = new Date(d.getTime()), guard = 0;
  while (isClosed(x, type) && guard < 30){ x = addDays(x, 1); guard++; }
  return x;
}

function esc(s){

}
function statusClass(st){ return st === '대출가능' ? 'ok' : (st === '대출중' ? 'no' : 'na'); }
const SHORT = {'흥부작은도서관':'흥부','북울진도서관':'북울진','울진남부도서관':'남부','울진작은도서관':'울진작은','근남작은도서관':'근남','매화작은도서관':'매화','기성작은도서관':'기성','평해작은도서관':'평해','온정작은도서관':'온정'};

  const base = 'https://lib.uljin.go.kr/content/01search/01_01.php?TAG1_cmd=IT&sh_TYPE=dan_book&TAG1_keyword=';
  const key = b.title.replace(/\s*:\s*.*$/, '').replace(/^\(.*?\)\s*/, '');
  return base + encodeURIComponent(key);

/* ────────── 계산 ────────── */
function compute(loanDate, type){
  const base = addDays(loanDate, 15);
  const due = isClosed(base, type) ? nextOpen(base, type) : base;
  const extBase = addDays(base, 7);
  const ext = isClosed(extBase, type) ? nextOpen(extBase, type) : extBase;
  return {base, due, ext, shifted: ymd(base) !== ymd(due), extShifted: ymd(extBase) !== ymd(ext)};
}

const form = document.getElementById('loanForm');
const dateInput = document.getElementById('l_date');
dateInput.value = ymd(today0());
const calcResult = document.getElementById('calcResult');

form.addEventListener('submit', e => {
  e.preventDefault();
  const title = document.getElementById('l_title').value.trim();
  if (!title) return;
  const type = document.getElementById('l_lib').value;
  const loanDate = parseYmd(dateInput.value);
  const c = compute(loanDate, type);
  const dday = daysBetween(today0(), c.due);
  let html = '<div class="big">' + esc(title) + '</div>';
  html += '<dl class="kv">';
  html += '<dt>대출일</dt><dd>' + labelFull(loanDate) + '</dd>';
  html += '<dt>반납예정일</dt><dd>' + labelFull(c.due) + (c.shifted ? ' <span class="small muted">(휴관일이라 다음 개관일)</span>' : '') + '</dd>';
  html += '<dt>연장하면</dt><dd>' + labelFull(c.ext) + ' <span class="small muted">(7일)</span></dd>';
  html += '<dt>남은 날</dt><dd><span class="dday ' + (dday < 0 ? 'over' : (dday <= 3 ? 'soon' : 'now')) + '">' + (dday < 0 ? 'D+' + Math.abs(dday) + ' 연체' : (dday === 0 ? 'D-DAY' : 'D-' + dday)) + '</span></dd>';
  html += '</dl>';
  calcResult.innerHTML = html;
  calcResult.classList.add('show');
  LOANS.push({title, borrower:'본인', type, loanDate: ymd(loanDate), interloan: document.getElementById('l_inter').checked, extended: false, added: ymd(new Date())});
  store.set('heungbu_loans_v4', LOANS);
  document.getElementById('l_title').value = '';
  document.getElementById('l_inter').checked = false;
  renderLoans();
});

function loanItem(l, i){
  const type = l.type || 'small';
  const c = compute(parseYmd(l.loanDate), type);
  const due = l.extended ? c.ext : c.due;
  const dday = daysBetween(today0(), due);
  const cls = dday < 0 ? 'over' : (dday <= 3 ? 'soon' : 'now');
  const txt = dday < 0 ? 'D+' + Math.abs(dday) + ' 연체' : (dday === 0 ? 'D-DAY' : 'D-' + dday);
  return '<li class="loan">' +
    '<div class="loan-top"><div><h4>' + esc(l.title) + '</h4>' +
      '<div class="who">' + (l.borrower ? esc(l.borrower) + ' · ' : '') + (l.interloan ? '상호대차 · ' : '') + '대출 ' + l.loanDate + '</div></div>' +
      '<span class="dday ' + cls + '">' + txt + '</span></div>' +
    '<div class="who">반납 ' + labelFull(due) + (l.extended ? ' · 7일 연장함' : (c.shifted ? ' · 다음 개관일' : '')) + '</div>' +
    '<div class="loan-actions">' +
      '<button class="mini" data-ext="' + i + '">' + (l.extended ? '연장 취소' : '7일 연장') + '</button>' +
      '<button class="mini danger" data-del="' + i + '">삭제</button>' +
    '</div></li>';
}

function renderLoans(){
  const list = document.getElementById('loanList');
  const empty = document.getElementById('loanEmpty');
  const cnt = document.getElementById('loanCount');
  const items = LOANS.map((l, i) => ({l, i}));
  items.sort((a, b) => {
    const A = compute(parseYmd(a.l.loanDate), a.l.type || 'small');
    const B = compute(parseYmd(b.l.loanDate), b.l.type || 'small');
    return (a.l.extended ? A.ext : A.due) - (b.l.extended ? B.ext : B.due);
  });
  list.innerHTML = items.map(x => loanItem(x.l, x.i)).join('');
  empty.hidden = LOANS.length > 0;
  cnt.textContent = LOANS.length ? '(' + LOANS.length + '권)' : '';
}
document.getElementById('loanList').addEventListener('click', e => {
  const ext = e.target.closest('[data-ext]');
  const del = e.target.closest('[data-del]');
  if (ext){ const i = Number(ext.dataset.ext); LOANS[i].extended = !LOANS[i].extended; store.set('heungbu_loans_v4', LOANS); renderLoans(); }
  if (del){ const i = Number(del.dataset.del); LOANS.splice(i, 1); store.set('heungbu_loans_v4', LOANS); renderLoans(); }
});

document.getElementById('resetAll').addEventListener('click', () => {

  FAV = new Set(); LOANS = [];
  store.set('heungbu_fav_v1', []); store.set('heungbu_loans_v4', []);

});
